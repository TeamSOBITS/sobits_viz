# SOBIT HOME in RViz2: which displays the generated config shows. The
# cameras, lidars and frames it names come from sobit_home_description
# config/sobit_home.robot.yaml. Regenerate after editing:
#   ros2 run sobits_viz_rviz make_config --params config/sobit_home/sobit_home.yaml
/**:
  ros__parameters:
    app_id: "sobit_home"


    views:
      scene:
        name: "Scene"
        enable: true
        camera_distance_m: 4.0
        camera_height_m: 0.6
        show_collision: false
        urdf: true
        grid: true
        description_topic: "robot_description"

      tf:
        name: "TF"
        enable: false
        label: true
        axis_scale: 0.4
        # `frames` defaults to the descriptor's base, end effector and camera frames.
        exclude: []

      cameras:
        head_camera:
          name: "Head"
          enable: true
          color:
            enable: true
            use_compressed: true
          depth:
            enable: true
            name: "Head depth"
            # RViz decodes every compressedDepth variant, and the compressed
            # frame is a few kB against more than a megabyte raw.
            use_compressed: true
            # Listed in the display tree; unticked, being one point per pixel.
            points:
              name: "Head cloud"
              enable: false
              size_px: 2.0
        hand_left_camera:
          name: "Hand Left"
          enable: true
          color:
            enable: true
            use_compressed: true
        hand_right_camera:
          name: "Hand Right"
          enable: true
          color:
            enable: true
            use_compressed: true

      lidars:
        lidar_front:
          name: "Lidar Front"
          enable: true
          scan: true
          point_size_px: 3.0
          color: [255, 0, 0]
        lidar_back:
          name: "Lidar Back"
          enable: true
          scan: true
          point_size_px: 3.0
          color: [0, 0, 255]
        # The two above merged into one scan; redundant next to them.
        lidar_merged:
          enable: false

      base:
        name: "Base"
        enable: true
