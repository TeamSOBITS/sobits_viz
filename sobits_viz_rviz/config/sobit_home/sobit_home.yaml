# SOBIT HOME in RViz2: which displays the generated config shows. The
# cameras and lidars it names come from sobits_viz_robots
# config/sobit_home/sobit_home.robot.yaml. Regenerate after editing:
#   ros2 run sobits_viz_rviz make_config --params config/sobit_home/sobit_home.yaml
/**:
  ros__parameters:
    app_id: "sobit_home"

    # SOBIT HOME publishes bare frame names; RViz does no stripping, so a
    # robot whose driver prefixes its frames sets this instead.
    frame_prefix: ""

    views:
      scene:
        name: "Scene"
        enable: true
        fixed_frame: "odom"
        camera_distance_m: 4.0
        camera_height_m: 0.6
        show_collision: false
        urdf: true
        grid: true
        tf: false
        scans: true
        description_topic: "robot_description"

      cameras:
        head_camera:
          name: "Head"
          enable: true
          color:
            enable: true
            use_compressed: true
          depth:
            enable: true
            name: "Head depth"
            # RViz decodes every compressedDepth variant, and the compressed
            # frame is a few kB against more than a megabyte raw.
            use_compressed: true
            range_m: 10.0
            # Listed in the display tree; unticked, being one point per pixel.
            points: false
            points_name: "Head cloud"
            points_size_px: 2.0
        hand_left_camera:
          name: "Hand Left"
          enable: true
          color:
            enable: true
            use_compressed: true
        hand_right_camera:
          name: "Hand Right"
          enable: true
          color:
            enable: true
            use_compressed: true

      lidars:
        lidar_front:
          enable: true
          point_size_px: 3.0
          color: [255, 0, 0]
        lidar_back:
          enable: true
          point_size_px: 3.0
          color: [0, 0, 255]

      base:
        name: "Base"
        enable: true
