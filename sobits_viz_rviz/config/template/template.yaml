# Skeleton of a robot's RViz2 settings: which displays the generated config
# shows. Copy to config/<robot>/<robot>.yaml, fill in every <...>, drop what
# the robot lacks, then generate its config (the descriptor is
# <robot>_description/config/<robot>.robot.yaml):
#   ros2 run sobits_viz_rviz make_config --params config/<robot>/<robot>.yaml
# ROS rejects an empty list or map, so leave a key out rather than empty.
/**:
  ros__parameters:
    app_id: "<robot>"


    views:
      # The model, grid, TF tree and laser scans.
      scene:
        name: "Scene"
        enable: true
        # fixed_frame defaults to the descriptor's odom_frame.
        camera_distance_m: 4.0
        camera_height_m: 0.6
        show_collision: false
        urdf: true
        grid: true
        description_topic: "robot_description"

      # One entry per camera name in the descriptor; each gets an Image display.
      tf:
        name: "TF"
        enable: false
        label: true
        axis_scale: 0.4
        # `frames` defaults to the descriptor's base, end effector and camera
        # frames; list others to replace them.
        exclude: []

      cameras:
        <camera>:
          name: "<Camera>"
          enable: true
          color:
            enable: true
            use_compressed: true
          # Only for a camera with a depth stream in the descriptor. RViz
          # decodes every compressedDepth variant, so depth compresses like
          # colour does. range_m defaults to the descriptor's.
          depth:
            enable: true
            name: "<camera> depth"
            use_compressed: true
            # Listed in the display tree; unticked, being one point per pixel.
            points:
              name: "<camera> cloud"
              enable: false
              size_px: 2.0

      # One entry per lidar name in the descriptor.
      lidars:
        <lidar>:
          name: "<lidar>"
          enable: true
          scan: true
          point_size_px: 3.0
          color: [255, 0, 0]

      # Only for a robot with a mobile_base in its descriptor.
      base:
        name: "Base"
        enable: true
