# SOBIT LIGHT in RViz2: which displays the generated config shows. The
# cameras and lidars it names come from sobits_viz_robots
# config/sobit_light/sobit_light.robot.yaml. Regenerate after editing:
#   ros2 run sobits_viz_rviz make_config --params config/sobit_light/sobit_light.yaml
/**:
  ros__parameters:
    app_id: "sobit_light"


    views:
      scene:
        name: "Scene"
        enable: true
        fixed_frame: "odom"
        camera_distance_m: 3.0
        camera_height_m: 0.4
        show_collision: false
        urdf: true
        grid: true
        description_topic: "robot_description"

      tf:
        name: "TF"
        enable: false
        names: true
        scale: 0.4
        frames:
          - base_footprint
          - head_camera_color_frame
          - hand_end_effector_link
        exclude: []

      cameras:
        head_camera:
          name: "Head"
          enable: true
          color:
            enable: true
            use_compressed: true
          depth:
            name: "Head depth"
            enable: true
            # RViz decodes every compressedDepth variant, and the compressed
            # frame is a few kB against more than a megabyte raw.
            use_compressed: true
            range_m: 10.0
            # Listed in the display tree; unticked, being one point per pixel.
            points:
              name: "Head cloud"
              enable: false
              size_px: 2.0
        hand_camera:
          name: "Hand"
          enable: true
          color:
            enable: true
            use_compressed: true
          depth:
            name: "Hand depth"
            enable: true
            use_compressed: true
            range_m: 10.0
            # Listed in the display tree; unticked, being one point per pixel.
            points:
              name: "Hand cloud"
              enable: false
              size_px: 2.0
        camera_front:
          name: "Front"
          enable: true
          color:
            enable: true
            use_compressed: true
        camera_rear:
          name: "Back"
          enable: true
          color:
            enable: true
            use_compressed: true

      lidars:
        lidar:
          name: "Lidar"
          enable: true
          scan: true
          point_size_px: 3.0
          color: [255, 0, 0]

      base:
        name: "Base"
        enable: true
