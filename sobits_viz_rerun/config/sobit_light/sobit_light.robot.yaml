# Copy of sobits_vla_common/robots/sobit_light.robot.yaml, taken 2026-09-18.
# That file is the original: this one does not track it, so check the two
# agree before trusting this copy. Intended differences: groups use the
# controllers that actually run (`*_position_controller`, not `*_joint_controller`);
# `manipulator` and `end_effector` drop their passive/excluded mimic joints;
# cameras gain a depth stream each; and `sensors.lidars` lists the laser
# scanner, which the original schema has no place for yet.
schema_version: 1
robot_id: sobit_light

joint_states_topic: /sobit_light/joint_states

groups:
  - name: head
    command_topic: /sobit_light/head_position_controller/joint_trajectory
    command_action: /sobit_light/head_position_controller/follow_joint_trajectory
    max_joint_delta: 0.10
    active: true
    joints:
      - ros_name: head_yaw_joint
        feature: head_yaw_joint
      - ros_name: head_pitch_joint
        feature: head_pitch_joint

  - name: manipulator
    command_topic: /sobit_light/arm_position_controller/joint_trajectory
    command_action: /sobit_light/arm_position_controller/follow_joint_trajectory
    max_joint_delta: 0.15
    active: true
    joints:
      - ros_name: arm_shoulder_roll_joint
        feature: arm_shoulder_roll_joint
      - ros_name: arm_shoulder_pitch_joint
        feature: arm_shoulder_pitch_joint
      - ros_name: arm_elbow_pitch_joint
        feature: arm_elbow_pitch_joint
      - ros_name: arm_forearm_roll_joint
        feature: arm_forearm_roll_joint
      - ros_name: arm_wrist_pitch_joint
        feature: arm_wrist_pitch_joint
      - ros_name: arm_wrist_roll_joint
        feature: arm_wrist_roll_joint

  - name: end_effector
    command_topic: /sobit_light/hand_position_controller/joint_trajectory
    command_action: /sobit_light/hand_position_controller/follow_joint_trajectory
    max_joint_delta: 0.30
    active: true
    relative_exclude: true   # gripper: absolute, never delta-converted
    joints:
      - ros_name: hand_joint
        feature: hand_joint

mobile_base:
  command_topic: /sobit_light/manual_control/cmd_vel
  odom_topic: /sobit_light/odometry/odometry
  has_vel_x: true
  has_vel_y: false
  has_vel_z: false
  has_vel_theta: true
  max_vel_x: 0.0
  max_vel_y: 0.0
  max_vel_z: 0.0
  max_vel_theta: 0.0
  features: [x.vel, theta.vel]
  # Commands below these are sent as zero (base creep suppression).
  linear_deadband: 0.015
  angular_deadband: 0.005

sensors:
  cameras:
    - name: head_camera
      compressed_topic: /sobit_light/head_camera/color/image_raw/compressed
      raw_topic: /sobit_light/head_camera/color/image_raw
      info_topic: /sobit_light/head_camera/color/camera_info
      encoding: ""
      compressed: true
      active: true
    - name: hand_camera
      compressed_topic: /sobit_light/hand_camera/color/image_raw/compressed
      raw_topic: /sobit_light/hand_camera/color/image_raw
      info_topic: /sobit_light/hand_camera/color/camera_info
      encoding: ""
      compressed: true
      active: true
    - name: camera_front
      compressed_topic: /sobit_light/front_camera/image_raw/compressed
      raw_topic: /sobit_light/front_camera/image_raw
      info_topic: /sobit_light/front_camera/camera_info
      encoding: ""
      compressed: true
      active: false
    - name: camera_rear
      compressed_topic: /sobit_light/back_camera/image_raw/compressed
      raw_topic: /sobit_light/back_camera/image_raw
      info_topic: /sobit_light/back_camera/camera_info
      encoding: ""
      compressed: true
      active: false
    # Head camera depth. Not in the original schema entry; added for the viewer.
    - name: head_camera
      compressed_topic: /sobit_light/head_camera/depth/image_rect_raw/compressedDepth
      raw_topic: /sobit_light/head_camera/depth/image_rect_raw
      info_topic: /sobit_light/head_camera/depth/camera_info
      encoding: "16UC1"
      compressed: true
      active: true
      is_depth: true
    # Hand camera depth, same treatment.
    - name: hand_camera
      compressed_topic: /sobit_light/hand_camera/depth/image_rect_raw/compressedDepth
      raw_topic: /sobit_light/hand_camera/depth/image_rect_raw
      info_topic: /sobit_light/hand_camera/depth/camera_info
      encoding: "16UC1"
      compressed: true
      active: true
      is_depth: true
  # Laser scanner, drawn as points in the 3D view. This package's addition to the schema.
  lidars:
    - name: lidar
      scan_topic: /sobit_light/lidar/scan
      active: true

ee_poses: []

excluded_joints:
  - hand_sub_joint
  - base_l_drive_wheel_joint
  - base_r_drive_wheel_joint
