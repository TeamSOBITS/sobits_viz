# Stop-gap: SOBIT LIGHT's schema v2 descriptor lives here until
# sobit_light_description ships its own config/sobit_light.robot.yaml.
# Converted from sobits_vla_common/robots/sobit_light.robot.yaml (v1) with the
# viewer additions: controllers that actually run, depth streams, the lidar.
schema_version: 2
robot_id: sobit_light
version: "1.0.0"
namespace: sobit_light
description_package: sobit_light_description

urdf:
  xacro: urdf/sobit_light.urdf.xacro

base_frame: base_footprint
odom_frame: odom
joint_states_topic: joint_states

groups:
  - name: head
    controller: head_position_controller
    joints:
      - head_yaw_joint
      - head_pitch_joint

  - name: manipulator
    controller: arm_position_controller
    uncommanded_joints: [arm_shoulder_pitch_sub_joint]
    joints:
      - arm_shoulder_roll_joint
      - arm_shoulder_pitch_joint
      - arm_elbow_pitch_joint
      - arm_forearm_roll_joint
      - arm_wrist_pitch_joint
      - arm_wrist_roll_joint

  - name: end_effector
    controller: hand_position_controller
    joints:
      - hand_joint

# Kachaka base: driven by its own driver, no ros2_control wheel controllers.
mobile_base:
  command_topic: manual_control/cmd_vel
  odom_topic: odometry/odometry
  has_vel_x: true
  has_vel_y: false
  has_vel_z: false
  has_vel_theta: true

sensors:
  cameras:
    - name: head_camera
      frame: head_camera_link
      color:
        frame: head_camera_color_optical_frame
        raw_topic: head_camera/color/image_raw
        compressed_topic: head_camera/color/image_raw/compressed
        info_topic: head_camera/color/camera_info
      depth:
        frame: head_camera_depth_optical_frame
        raw_topic: head_camera/depth/image_rect_raw
        compressed_topic: head_camera/depth/image_rect_raw/compressedDepth
        info_topic: head_camera/depth/camera_info
        points_topic: head_camera/depth/points
        encoding: 16UC1
        range_m: [0.1, 10.0]
    - name: hand_camera
      frame: hand_camera_link
      color:
        frame: hand_camera_color_optical_frame
        raw_topic: hand_camera/color/image_raw
        compressed_topic: hand_camera/color/image_raw/compressed
        info_topic: hand_camera/color/camera_info
      depth:
        frame: hand_camera_depth_optical_frame
        raw_topic: hand_camera/depth/image_rect_raw
        compressed_topic: hand_camera/depth/image_rect_raw/compressedDepth
        info_topic: hand_camera/depth/camera_info
        points_topic: hand_camera/depth/points
        encoding: 16UC1
        range_m: [0.1, 10.0]
    # The Kachaka base cameras have no optical frame in the URDF, so their
    # camera_info names the camera link itself.
    - name: camera_front
      frame: camera_front_link
      color:
        frame: camera_front_link
        raw_topic: front_camera/image_raw
        compressed_topic: front_camera/image_raw/compressed
        info_topic: front_camera/camera_info
    - name: camera_rear
      frame: camera_back_link
      color:
        frame: camera_back_link
        raw_topic: back_camera/image_raw
        compressed_topic: back_camera/image_raw/compressed
        info_topic: back_camera/camera_info

  lidars:
    - name: lidar
      frame: laser_frame
      scan_topic: lidar/scan

ee:
  - name: hand
    ee_link: hand_end_effector_link
    reference_frame: base_footprint

# Wheels (no controller entry above) and the hand's passive mimic joint.
excluded_joints:
  - hand_sub_joint
  - base_l_drive_wheel_joint
  - base_r_drive_wheel_joint
